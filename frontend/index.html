<title>Sahayam Ops</title>

<style>
/* ============================================================
   TOKENS &mdash; Sahayam civic design system (backwater teal +
   turmeric). A light, high-legibility palette built for crisis
   conditions: old phones, bright sunlight, low literacy. This
   replaces the earlier dark "monsoon night" ops-console theme --
   there is now a single, permanent light theme, no toggle.
   ============================================================ */
:root{
  color-scheme: light;
  --bg: #EEF1E5;
  --bg-grid: #E2E8D6;
  --surface: #FFFFFF;
  --surface-2: #E2E8D6;
  --surface-3: #D3DDC4;
  --border: #C9D2BC;
  --border-soft: #DCE3D2;
  --text: #142E29;
  --text-dim: #3E5750;
  --text-faint: #6C8478;

  --accent: #14574C;
  --accent-ink: #FFFFFF;
  --accent-dim: #0C3A32;
  --accent-tint: #DCE9E2;

  --critical: #AD3226;
  --critical-bg: #F6DBD6;
  --high: #D3652C;
  --high-bg: #FBE4D6;
  --medium: #DA9F35;
  --medium-bg: #FBF0DA;
  --low: #5E8A66;
  --low-bg: #E4EEE2;

  --sms: #3D5A8A;
  --sms-bg: #DCE3F0;

  --shadow: 0 1px 2px rgba(20,46,41,0.06), 0 6px 16px rgba(20,46,41,0.07);
  --radius: 10px;
  --radius-sm: 6px;
}

*{ box-sizing: border-box; }
html, body{ height: 100%; }
body{
  margin:0;
  background: var(--bg);
  color: var(--text);
  font-family: 'Manrope', 'Noto Sans Malayalam', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
h1,h2,h3,h4{ font-family:'Manrope', system-ui, sans-serif; margin:0; letter-spacing:-0.01em; font-weight:800; color: var(--accent-dim); }
p{ margin:0; }
button{ font-family: inherit; }
.mono{ font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace; }
::selection{ background: var(--accent); color: var(--accent-ink); }

*::-webkit-scrollbar{ width:8px; height:8px; }
*::-webkit-scrollbar-track{ background: transparent; }
*::-webkit-scrollbar-thumb{ background: var(--border); border-radius:8px; }

/* ---------------- layout shell ---------------- */
#root{ min-height: 100%; display:flex; flex-direction:column; }

.header{
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40;
  display:flex; align-items:center; gap:16px;
  padding: 12px clamp(16px,3vw,28px);
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border-soft);
  flex-wrap: wrap;
}
.brand{ display:flex; align-items:center; gap:10px; margin-right:6px; }
.brand-mark{
  width:34px; height:34px; border-radius:9px;
  background: linear-gradient(155deg, var(--accent), var(--accent-dim));
  display:flex; align-items:center; justify-content:center;
  color: var(--accent-ink); font-weight:800; font-size:15px; flex-shrink:0;
  box-shadow: var(--shadow);
}
.brand-text{ display:flex; flex-direction:column; line-height:1.15; }
.brand-text b{ font-family:'Manrope'; font-weight:800; font-size:16px; }
.brand-text span{ font-size:11px; color:var(--text-dim); font-weight:600; letter-spacing:0.02em; }

.view-tabs{
  display:flex; background: var(--surface-2); border:1px solid var(--border);
  border-radius: 999px; padding:3px; gap:2px;
}
.view-tab{
  border:none; background:transparent; color:var(--text-dim);
  padding:7px 14px; border-radius:999px; font-weight:700; font-size:13px;
  cursor:pointer; display:flex; align-items:center; gap:6px; transition: all .15s ease;
  white-space: nowrap;
}
.view-tab.active{ background: var(--accent); color: var(--accent-ink); }
.view-tab:not(.active):hover{ color: var(--text); }

.header-spacer{ flex:1; }

.net-toggle{
  display:flex; align-items:center; gap:8px;
  background: var(--surface-2); border:1px solid var(--border);
  border-radius:999px; padding:5px 6px 5px 12px; cursor:pointer;
  transition: border-color .15s ease;
}
.net-toggle:hover{ border-color: var(--text-faint); }
.net-dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.net-dot.online{ background: var(--low); box-shadow: 0 0 0 3px color-mix(in srgb, var(--low) 25%, transparent); }
.net-dot.sms{ background: var(--sms); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse{ 0%,100%{ box-shadow:0 0 0 0 color-mix(in srgb, var(--sms) 45%, transparent);} 50%{ box-shadow:0 0 0 6px transparent;} }
.net-label{ font-size:12.5px; font-weight:700; color:var(--text); }
.net-switch{
  width:34px; height:20px; border-radius:999px; background:var(--surface-3);
  position:relative; border:1px solid var(--border);
}
.net-switch::after{
  content:''; position:absolute; top:1px; left:1px; width:16px; height:16px;
  border-radius:50%; background: var(--text-dim); transition: transform .18s ease, background .18s ease;
}
.net-toggle.sms .net-switch::after{ transform: translateX(14px); background: var(--sms); }

.clock{ font-size:12px; color:var(--text-faint); font-weight:600; min-width:78px; text-align:right; }

.user-chip{
  display:flex; align-items:center; gap:6px; padding:5px 6px 5px 10px; border-radius:20px;
  background: var(--surface-2); border:1px solid var(--border); color:var(--text-dim);
  font-size:11.5px; font-weight:700; flex-shrink:0; white-space:nowrap;
}
.user-chip-logout{
  width:20px; height:20px; border-radius:50%; border:none; background:transparent; color:var(--text-faint);
  display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
}
.user-chip-logout:hover{ background: var(--surface-3); color:var(--critical); }

/* ---------------- login gate ---------------- */
.login-shell{ max-width:380px; margin:40px auto; padding:0 16px; }
.login-shell .card{ padding:26px 22px; }
.login-icon{
  width:44px; height:44px; border-radius:12px; background: var(--accent); color: var(--accent-ink);
  display:flex; align-items:center; justify-content:center; margin-bottom:14px;
}
.login-shell h2{ font-size:18px; margin-bottom:4px; }
.login-shell .sub{ color:var(--text-dim); font-size:12.5px; margin-bottom:18px; }
.login-error{
  background: var(--critical-bg); color: var(--critical); font-size:12px; font-weight:700;
  padding:9px 11px; border-radius: var(--radius-sm); margin-bottom:12px;
}
.login-hint{
  margin-top:16px; padding-top:14px; border-top:1px dashed var(--border); font-size:11px; color:var(--text-faint);
  line-height:1.6;
}
.login-hint b{ color:var(--text-dim); }

/* ---------------- sms fallback banner ---------------- */
.sms-banner{
  display:flex; align-items:center; gap:10px; justify-content:center; flex-wrap:wrap; text-align:center;
  background: var(--sms-bg); color: var(--sms); font-weight:700; font-size:12.5px;
  padding:8px 16px; border-bottom:1px solid var(--border-soft);
}
.sms-banner .mono{ font-weight:500; color: var(--text-dim); }

/* ---------------- main containers ---------------- */
.main{ flex:1; width:100%; max-width:1400px; margin:0 auto; padding: 20px clamp(16px,3vw,28px) 70px; }
.admin-grid{ display:grid; grid-template-columns: 1.5fr 1fr; gap:18px; align-items:start; }
.admin-grid-lower{ display:grid; grid-template-columns: 1fr 1fr; gap:18px; margin-top:18px; }
@media (max-width: 980px){
  .admin-grid, .admin-grid-lower{ grid-template-columns: 1fr; }
}

.card{
  background: var(--surface); border:1.5px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.card-head{
  display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--border-soft);
}
.card-head h3{ font-size:14px; font-weight:800; }
.card-head .sub{ font-size:11.5px; color:var(--text-faint); font-weight:600; }
.card-head-spacer{ flex:1; }
.card-body{ padding:16px; }

/* ---------------- metric tiles ---------------- */
.metrics{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:18px; }
@media (max-width: 700px){ .metrics{ grid-template-columns:repeat(2,1fr); } }
.metric{
  background: var(--surface); border:1px solid var(--border-soft); border-radius: var(--radius);
  padding:14px 16px; box-shadow: var(--shadow); position:relative; overflow:hidden;
}
.metric .icon-wrap{
  width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center;
  margin-bottom:10px;
}
.metric .num{ font-family:'Manrope'; font-size:26px; font-weight:800; line-height:1; font-variant-numeric: tabular-nums; }
.metric .label{ font-size:11.5px; color:var(--text-dim); font-weight:700; margin-top:4px; }

/* ---------------- kerala map ---------------- */
.map-wrap{ padding:10px; overflow:hidden; }
.map-svg{ width:100%; height:auto; display:block; max-height: 74vh; overflow:hidden; }
.map-svg.pickable{ cursor: crosshair; }
.map-zoom-group{ transition: transform 480ms cubic-bezier(0.22, 1, 0.36, 1); }
.district-shape{ cursor:pointer; transition: filter .15s ease, opacity .15s ease; stroke:var(--bg); stroke-width:1.1; }
.district-shape:hover{ filter: brightness(1.2); }
.district-shape.dimmed{ opacity:0.22; }
.district-shape.static{ cursor:default; }
.district-label{ font-family:'Manrope'; font-weight:800; font-size:8.6px; fill: var(--text); pointer-events:none; }
.district-label-sub{ font-family:'IBM Plex Mono'; font-weight:500; font-size:5.6px; fill: color-mix(in srgb, var(--text) 60%, transparent); pointer-events:none; }
.req-marker{ cursor:pointer; }
.req-marker.static{ cursor: default; }
.req-marker circle.pulse{ animation: markerpulse 1.8s ease-out infinite; transform-origin: center; }
@keyframes markerpulse{ 0%{ r:5; opacity:0.55;} 100%{ r:15; opacity:0;} }
.pin-marker circle.pulse{ animation: markerpulse 1.6s ease-out infinite; transform-origin: center; }
.hotspot-cluster{ pointer-events:none; }
.hotspot-ring{ fill:none; stroke: var(--critical); stroke-width:1; opacity:0.4; animation: hotspotpulse 2.4s ease-out infinite; transform-origin: center; }
@keyframes hotspotpulse{ 0%{ r:10; opacity:0.5; } 100%{ r:26; opacity:0; } }
.hotspot-label{ font-family:'IBM Plex Mono'; font-weight:700; font-size:5.4px; fill: var(--critical); }
.legend{ display:flex; flex-wrap:wrap; gap:12px; padding:0 16px 14px; }
.legend-item{ display:flex; align-items:center; gap:6px; font-size:10.5px; color:var(--text-dim); font-weight:700; }
.legend-swatch{ width:10px; height:10px; border-radius:3px; }
.map-filter-chip{
  display:inline-flex; align-items:center; gap:6px; background: var(--accent); color:var(--accent-ink);
  border-radius:999px; padding:5px 8px 5px 12px; font-size:12px; font-weight:800; cursor:pointer; border:none;
}

/* ---------------- priority queue ---------------- */
.queue-list{ display:flex; flex-direction:column; gap:8px; max-height:520px; overflow-y:auto; padding-right:2px; }
.req-row{
  display:flex; gap:10px; align-items:flex-start; padding:11px 12px; border-radius: var(--radius-sm);
  border:1px solid var(--border-soft); background: var(--surface-2);
}
.pri-stripe{ width:4px; align-self:stretch; border-radius:3px; flex-shrink:0; }
.req-row-body{ flex:1; min-width:0; }
.req-row-top{ display:flex; align-items:center; gap:8px; margin-bottom:3px; flex-wrap:wrap; }
.pri-pill{
  font-size:10px; font-weight:800; padding:2px 7px; border-radius:5px; letter-spacing:0.02em; white-space:nowrap;
}
.req-row-title{ font-size:13px; font-weight:700; color:var(--text); }
.req-row-meta{ font-size:11px; color:var(--text-faint); font-weight:600; display:flex; gap:8px; flex-wrap:wrap; margin-top:4px; }
.req-row-desc{ font-size:12px; color:var(--text-dim); margin-top:3px; line-height:1.4; }
.status-pill{
  font-size:10px; font-weight:800; padding:3px 8px; border-radius:999px; white-space:nowrap; flex-shrink:0;
  background: var(--surface-3); color: var(--text-dim); border:1px solid var(--border);
}
.channel-tag{ display:inline-flex; align-items:center; gap:3px; }

/* ---------------- forms ---------------- */
.field{ margin-bottom:12px; }
.field label{ display:block; font-size:11.5px; font-weight:800; color:var(--text-dim); margin-bottom:5px; letter-spacing:0.01em; }
.field input, .field select, .field textarea{
  width:100%; background: #fff; border:1.5px solid var(--border); color:var(--text);
  border-radius: var(--radius-sm); padding:9px 11px; font-size:13px; font-family:inherit;
}
.field input:focus, .field select:focus, .field textarea:focus{
  outline:3px solid var(--accent-tint); outline-offset:0; border-color:var(--accent);
}
.field-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.pri-select{ display:flex; gap:6px; flex-wrap:wrap; }
.pri-opt{
  flex:1; min-width:70px; text-align:center; padding:8px 6px; border-radius: var(--radius-sm);
  border:1.5px solid var(--border); background:var(--surface-2); cursor:pointer; font-size:11.5px; font-weight:800;
  color:var(--text-dim); transition: all .12s ease;
}
.pri-opt.active{ color: #fff; border-color: transparent; }

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  border-radius: var(--radius-sm); border:1.5px solid transparent; font-weight:700; font-size:13px; cursor:pointer;
  padding:10px 16px; transition: transform .08s ease, background .15s ease, border-color .15s ease;
}
.btn:active{ transform: scale(0.98); }
.btn:disabled{ opacity:0.5; cursor:not-allowed; }
.btn-primary{ background: var(--accent); color: var(--accent-ink); }
.btn-primary:hover:not(:disabled){ background: var(--accent-dim); }
.btn-block{ width:100%; }
.btn-ghost{ background: transparent; color:var(--text); border-color:var(--border); }
.btn-ghost:hover{ border-color: var(--accent); color: var(--accent); }
.btn-sm{ padding:7px 11px; font-size:12px; }

/* ---------------- zone management ---------------- */
.zone-mgmt-list{ max-height: 420px; overflow-y:auto; }
.zone-mgmt-row{
  display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border-soft);
}
.zone-mgmt-row:last-child{ border-bottom:none; }
.zone-mgmt-dot{ width:10px; height:10px; border-radius:3px; flex-shrink:0; }
.zone-mgmt-name{ flex:1; font-size:13px; font-weight:700; cursor: pointer; }
.zone-mgmt-count{ font-size:11px; color:var(--text-faint); font-weight:600; }
.sev-select{
  background: var(--surface-2); border:1px solid var(--border); color:var(--text);
  border-radius:6px; padding:5px 8px; font-size:11.5px; font-weight:700;
}

/* ---------------- volunteer view ---------------- */
.vshell{ max-width:520px; margin:0 auto; padding: 16px clamp(16px,4vw,20px) 80px; }
.v-profile{
  display:flex; align-items:center; gap:12px; padding:14px 16px; margin-bottom:14px;
}
.v-avatar{
  width:44px; height:44px; border-radius:50%; background: linear-gradient(155deg, var(--accent), var(--accent-dim));
  display:flex; align-items:center; justify-content:center; font-weight:800; color:var(--accent-ink); flex-shrink:0;
}
.v-name{ font-weight:800; font-size:15px; }
.v-sub{ font-size:11.5px; color:var(--text-dim); font-weight:600; margin-top:1px; }
.v-status-select{ margin-left:auto; }

.v-stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:16px; }
.v-stat{ background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-sm); padding:10px; text-align:center; }
.v-stat .n{ font-family:'Manrope'; font-weight:800; font-size:18px; }
.v-stat .l{ font-size:10px; color:var(--text-faint); font-weight:700; margin-top:2px; }

.section-title{ display:flex; align-items:center; gap:8px; margin: 18px 0 10px; }
.section-title h3{ font-size:13px; font-weight:800; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.04em; }

.task-card{
  background: var(--surface); border:1px solid var(--border-soft); border-radius: var(--radius);
  padding:14px; margin-bottom:12px; box-shadow: var(--shadow);
}
.task-top{ display:flex; align-items:flex-start; gap:10px; margin-bottom:8px; }
.task-pri-badge{
  width:36px; height:36px; border-radius:9px; display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
}
.task-title{ font-size:14px; font-weight:800; line-height:1.3; }
.task-loc{ font-size:11.5px; color:var(--text-faint); font-weight:600; margin-top:2px; display:flex; align-items:center; gap:4px; }
.task-desc{ font-size:12.5px; color:var(--text-dim); line-height:1.5; margin: 8px 0 10px; }
.task-meta-row{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
.task-meta{ display:flex; align-items:center; gap:4px; font-size:11px; color:var(--text-faint); font-weight:700; }
.status-steps{ display:flex; gap:6px; }
.status-step{
  flex:1; padding:9px 4px; border-radius: var(--radius-sm); border:1.5px solid var(--border);
  background: var(--surface-2); font-size:11px; font-weight:800; color:var(--text-dim); text-align:center; cursor:pointer;
  transition: all .12s ease;
}
.status-step.done{ background: var(--low); border-color: var(--low); color:#0C1917; }
.status-step.current{ border-color: var(--accent); color:var(--accent); }
.status-step:disabled{ cursor:default; opacity:0.55; }

.sms-payload-card{
  background: var(--sms-bg); border:1px solid color-mix(in srgb, var(--sms) 40%, var(--border));
  border-radius: var(--radius); padding:14px; margin-bottom:12px;
}
.sms-payload-head{ display:flex; align-items:center; gap:7px; margin-bottom:8px; color:var(--sms); font-weight:800; font-size:11.5px; }
.sms-json{
  background: var(--bg); border-radius:7px; padding:10px 12px; font-size:11px; line-height:1.65;
  overflow-x:auto; color: var(--text-dim);
}
.sms-json .k{ color: var(--sms); }
.sms-json .v{ color: var(--text); }
.sms-actions{ display:flex; gap:8px; margin-top:10px; }

.empty-state{
  text-align:center; padding:36px 20px; color:var(--text-faint);
}
.empty-state svg{ margin-bottom:10px; opacity:0.5; }
.empty-state p{ font-size:12.5px; font-weight:600; }

.filter-banner{
  display:flex; align-items:center; gap:10px; background: var(--surface-2); border:1px solid var(--border);
  border-radius: var(--radius-sm); padding:9px 12px; margin-bottom:14px; font-size:12.5px; font-weight:700;
}

.badge-count{
  display:inline-flex; align-items:center; justify-content:center; min-width:18px; height:18px; padding:0 5px;
  border-radius:999px; background: var(--critical); color:#fff; font-size:10px; font-weight:800;
}

.mobile-view-bar{ display:none; }
@media (max-width: 760px){
  .header .view-tabs{ display:none; }
  .mobile-view-bar{
    display:flex; gap:2px; background:var(--surface-2); border-top:1px solid var(--border-soft);
    position: sticky; bottom: env(safe-area-inset-bottom, 0px); z-index:40; padding:6px;
  }
  .mobile-view-bar button{
    flex:1; background:transparent; border:none; color:var(--text-dim); font-weight:800; font-size:11px;
    padding:8px 2px; border-radius:8px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px;
  }
  .mobile-view-bar button.active{ background: var(--surface-3); color:var(--accent); }
  .clock{ display:none; }
}

/* ---------------- citizen view ---------------- */
.cshell{ max-width:560px; margin:0 auto; padding: 20px clamp(16px,4vw,20px) 80px; }
.c-hero{ margin-bottom:18px; }
.c-hero h1{ font-size: clamp(21px,5vw,27px); margin-bottom:6px; }
.c-hero p{ color:var(--text-dim); font-size:13.5px; line-height:1.5; }

.pin-hint{
  display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:700; color:var(--text-dim);
  padding:10px 12px; background: var(--surface-2); border:1px solid var(--border); border-radius: var(--radius-sm);
  margin-bottom:10px;
}
.pin-hint.set{ color: var(--accent); border-color: var(--accent); }
.pin-hint .btn{ flex-shrink:0; }
.geo-note{ font-size:11px; color: var(--text-faint); margin:-4px 0 10px; padding:0 2px; }

.cat-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:7px; }
@media (max-width: 480px){ .cat-grid{ grid-template-columns:repeat(3,1fr); } }
.cat-chip{
  display:flex; flex-direction:column; align-items:center; gap:5px; padding:10px 4px; border-radius: var(--radius-sm);
  border:1.5px solid var(--border); background:var(--surface-2); cursor:pointer; font-size:10.5px; font-weight:800;
  color:var(--text-dim); transition: all .12s ease; text-align:center;
}
.cat-chip.active{ border-color: var(--accent); color:var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--surface-2)); }

.vuln-grid{ display:flex; flex-wrap:wrap; gap:8px; }
.vuln-chip{
  display:flex; align-items:center; gap:6px; padding:9px 13px; border-radius:999px; border:1.5px solid var(--border);
  background:var(--surface-2); cursor:pointer; font-size:12px; font-weight:700; color:var(--text-dim);
}
.vuln-chip.active{ border-color: var(--high); color: var(--high); background: color-mix(in srgb, var(--high) 14%, var(--surface-2)); }

.confirm-panel{ padding:22px; text-align:center; }
.confirm-panel .pri-pill{ font-size:13px; padding:6px 14px; margin-bottom:10px; display:inline-flex; }
.confirm-panel h2{ font-size:18px; margin-bottom:6px; }
.confirm-panel p{ color:var(--text-dim); font-size:13px; margin-bottom:4px; }
.confirm-stat-row{ display:flex; justify-content:center; gap:22px; margin:16px 0; }
.confirm-stat{ text-align:center; }
.confirm-stat .n{ font-family:'Manrope'; font-size:20px; font-weight:800; }
.confirm-stat .l{ font-size:10px; color:var(--text-faint); font-weight:700; margin-top:2px; }

.my-report-row{
  display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:var(--radius-sm);
  border:1px solid var(--border-soft); background: var(--surface-2); margin-bottom:8px;
}
.my-report-row .desc{ flex:1; min-width:0; font-size:12.5px; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.my-report-row .meta{ font-size:10.5px; color:var(--text-faint); font-weight:600; margin-top:2px; }

const KM_PER_UNIT = 111.0 / KERALA_PROJ.scale;

function project(lat, lng) {
  const x = (lng - KERALA_PROJ.minLng) * KERALA_PROJ.cosMean * KERALA_PROJ.scale + KERALA_PROJ.pad;
  const y = (KERALA_PROJ.maxLat - lat) * KERALA_PROJ.scale + KERALA_PROJ.pad;
  return [x, y];
}
function unproject(x, y) {
  const lng = (x - KERALA_PROJ.pad) / (KERALA_PROJ.cosMean * KERALA_PROJ.scale) + KERALA_PROJ.minLng;
  const lat = KERALA_PROJ.maxLat - (y - KERALA_PROJ.pad) / KERALA_PROJ.scale;
  return [lat, lng];
}
function nearestDistrict(lat, lng) {
  const [x, y] = project(lat, lng);
  let best = null, bestD = Infinity;
  for (const d of KERALA_DISTRICTS) {
    const dd = Math.hypot(d.cx - x, d.cy - y);
    if (dd < bestD) { bestD = dd; best = d; }
  }
  return best;
}
function districtCenterLatLng(id) {
  const d = districtById[id];
  return unproject(d.cx, d.cy);
}

const CRITICAL_KEYWORDS = ["trapped", "drowning", "not breathing", "unconscious", "bleeding heavily", "collapsed", "buried", "capsized", "chest pain", "labour", "labor", "rising rapidly", "cannot swim", "can't swim", "swept away", "stuck on roof", "stuck on the roof"];
const HIGH_KEYWORDS = ["insulin", "dialysis", "wheelchair", "cannot evacuate", "can't evacuate", "diabetic", "pregnant", "cut off", "oxygen", "ventilator", "infant", "newborn", "bedridden"];

function classifyUrgency(text, flags) {
  const t = (text || "").toLowerCase();
  let score = 32;
  if (CRITICAL_KEYWORDS.some(k => t.includes(k))) score = 90;
  else if (HIGH_KEYWORDS.some(k => t.includes(k))) score = 66;
  if (flags.elderly) score += 9;
  if (flags.children) score += 9;
  if (flags.medical) score += 14;
  score = Math.min(100, Math.round(score));
  const priority = score >= 80 ? "Emergency" : score >= 55 ? "High" : score >= 30 ? "Medium" : "Low";
  return { score, priority };
}

async function postRequestToBackend(s) {

    body: JSON.stringify({
      name: s.name || null, phone: s.phone || null, channel: s.channel || "app", language: "en",

  });
  if (!res.ok) throw new Error("POST /api/requests -> " + res.status);
  return res.json();

async function extractError(res, fallback) {
  try { const j = await res.json(); return j.detail || fallback; } catch (e) { return fallback; }
}

async function patchRequestOnBackend(id, body, token) {
  const res = await fetch(api(`/api/requests/${id}`), {
    method: "PATCH",

  });
  if (!res.ok) throw new Error(await extractError(res, "PATCH /api/requests/" + id + " -> " + res.status));

}

function relTime(ts, tick) {
  const diff = Math.max(0, tick - ts);
  const s = Math.floor(diff / 1000);
  if (s < 5) return "Just now";
  if (s < 60) return s + "s ago";
  const m = Math.floor(s / 60);
  if (m < 60) return m + "m ago";
  const h = Math.floor(m / 60);
  if (h < 24) return h + "h ago";
  return Math.floor(h / 24) + "d ago";
}
function fmtClock(tick) {
  return new Date(tick).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
}
function dist(a, b) {
  return Math.hypot(a[0] - b[0], a[1] - b[1]);
}

function AppProvider({ children }) {

  const [authToken, setAuthToken] = useState(() => loadLocal("sahayam_auth_token", null));
  const [currentUser, setCurrentUser] = useState(() => loadLocal("sahayam_current_user", null));
  const [authError, setAuthError] = useState(null);
  const [authBusy, setAuthBusy] = useState(false);

  const login = useCallback(async (username, password) => {
    setAuthBusy(true);
    setAuthError(null);
    try {
      const { token, user } = await loginRequest(username, password);
      setAuthToken(token); setCurrentUser(user);
      saveLocal("sahayam_auth_token", token); saveLocal("sahayam_current_user", user);
      setBackendOk(true);
      return true;
    } catch (err) {
      setAuthError(err.message || "Login failed");
      return false;
    } finally {
      setAuthBusy(false);
    }
  }, []);

  const logout = useCallback(() => {
    if (authToken) logoutRequest(authToken);
    setAuthToken(null); setCurrentUser(null); setVolunteers([]);
    saveLocal("sahayam_auth_token", null); saveLocal("sahayam_current_user", null);
  }, [authToken]);

  // Continue as a local-only demo volunteer/admin when the backend can't be
  // reached at all -- there's nothing to authenticate against, so this just
  // lets the standalone offline demo keep working.
  const continueOffline = useCallback((role) => {
    const user = role === "volunteer"
      ? { id: OFFLINE_VOLUNTEERS[0].id, username: "demo", role: "volunteer", name: OFFLINE_VOLUNTEERS[0].name, lat: OFFLINE_VOLUNTEERS[0].lat, lng: OFFLINE_VOLUNTEERS[0].lng }
      : { id: 0, username: "demo", role: "admin", name: "Admin (offline demo)", lat: null, lng: null };
    setCurrentUser(user);
    setVolunteers(OFFLINE_VOLUNTEERS);
  }, []);

  // Re-validate a saved session on load, and load the volunteer roster once
  // logged in (their names/base locations are only visible to logged-in
  // admins/volunteers).
  useEffect(() => {
    if (!authToken) return;
    let cancelled = false;
    fetchMe(authToken).then((user) => {
      if (cancelled) return;
      setCurrentUser(user);
      saveLocal("sahayam_current_user", user);
      return fetchVolunteers(authToken);
    }).then((vols) => { if (!cancelled && vols) setVolunteers(vols); })
      .catch(() => {
        if (cancelled) return;
        // token expired/invalid (or backend restarted, wiping in-memory
        // sessions) -- clear it so the login screen reappears.
        setAuthToken(null); setCurrentUser(null);
        saveLocal("sahayam_auth_token", null); saveLocal("sahayam_current_user", null);
      });
    return () => { cancelled = true; };
  }, [authToken]);

  useEffect(() => {
    const t = setInterval(() => setTick(Date.now()), 1000);
    return () => clearInterval(t);
  }, []);

  // Pull the live request list from the FastAPI backend. On first load, if
  // the backend has no data yet, seed it with the demo scenario so the
  // dashboards aren't empty. If the backend can't be reached at all, fall
  // back to local-only demo data so the prototype still demos standalone.
  const refreshRequests = useCallback(async () => {
    try {
      const res = await fetch(api("/api/requests"));
      if (!res.ok) throw new Error(String(res.status));
      let data = await res.json();
      if (data.length === 0 && !seededRef.current) {
        seededRef.current = true;
        await seedBackend();
        const res2 = await fetch(api("/api/requests"));
        data = res2.ok ? await res2.json() : [];
      }
      setBackendOk(true);
      setRequests(data.map(apiToUi));
    } catch (err) {
      setBackendOk(false);
      if (!seededRef.current) {
        seededRef.current = true;
        setRequests(seedRequestsLocal());
      }
    }
  }, []);

  useEffect(() => {
    refreshRequests();
    const t = setInterval(refreshRequests, 5000);
    return () => clearInterval(t);
  }, [refreshRequests]);

  const zoneSeverity = useMemo(() => Object.fromEntries(zones.map(z => [z.id, z.severity])), [zones]);

  const addRequest = useCallback(async (data) => {
    let { lat, lng, districtId } = data;
    if (lat == null && districtId) {
      const [la, ln] = districtCenterLatLng(districtId);
      lat = la; lng = ln;
    }
    const locationText = districtId && districtById[districtId] ? districtById[districtId].name : null;
    try {
      const saved = await postRequestToBackend({
        name: data.name, phone: data.phone, channel: network === "sms" ? "sms" : "app",
        desc: data.desc, category: data.category || "general",
        has_elderly: !!data.has_elderly, has_children: !!data.has_children, has_medical_need: !!data.has_medical,
        lat, lng, location_text: locationText,
      });
      setBackendOk(true);
      const req = apiToUi(saved);
      setRequests(rs => [req, ...rs.filter(r => r.id !== req.id)]);
      return req;
    } catch (err) {
      console.warn("Sahayam: backend unreachable, adding request locally only.", err);
      setBackendOk(false);
      const req = {
        id: nextId(), createdAt: Date.now(), channel: network === "sms" ? "sms" : "app",
        assignedTo: null, status: "Pending", category: "general", priority: "Medium",
        ...data, lat, lng, districtId: districtId || (lat != null ? nearestDistrict(lat, lng).id : KERALA_DISTRICTS[0].id),
      };
      setRequests(rs => [req, ...rs]);
      return req;
    }
  }, [network]);

  const updateStatus = useCallback((id, status) => {
    setRequests(rs => rs.map(r => r.id === id ? { ...r, status } : r));
    if (typeof id !== "number" || !authToken) return; // local-only record, or not signed in: nothing to sync
    patchRequestOnBackend(id, { status: UI_STATUS_TO_API[status] || String(status).toLowerCase() }, authToken)
      .then(() => setBackendOk(true))
      .catch((err) => { console.warn("Sahayam: failed to sync status update.", err); setBackendOk(false); });
  }, [authToken]);

  // Admin action: assign a specific volunteer to a request.
  const assignRequest = useCallback((id, volunteerId) => {
    const vol = volunteers.find(v => v.id === volunteerId);
    setRequests(rs => rs.map(r => r.id === id ? { ...r, assignedTo: vol ? vol.name : r.assignedTo, status: "Assigned" } : r));
    if (typeof id !== "number" || !authToken) return;
    patchRequestOnBackend(id, { status: "assigned", assigned_to: vol ? vol.name : null }, authToken)
      .then(() => setBackendOk(true))
      .catch((err) => { console.warn("Sahayam: failed to sync assignment.", err); setBackendOk(false); });
  }, [authToken, volunteers]);

  // Volunteer action: self-claim an unclaimed request.
  const claimRequest = useCallback(async (id) => {
    if (!currentUser || currentUser.role !== "volunteer") return { ok: false, error: "Not signed in as a volunteer" };
    setRequests(rs => rs.map(r => r.id === id ? { ...r, assignedTo: currentUser.name, status: "Assigned" } : r));
    if (typeof id !== "number" || !authToken) return { ok: true };
    try {
      const saved = await claimRequestOnBackend(id, authToken);
      setRequests(rs => rs.map(r => r.id === id ? apiToUi(saved) : r));
      setBackendOk(true);
      return { ok: true };
    } catch (err) {
      console.warn("Sahayam: claim failed.", err);
      return { ok: false, error: err.message };
    }
  }, [authToken, currentUser]);

  // Poll computed hotspot clusters (real DBSCAN output from the backend)
  // for the map overlay.
  useEffect(() => {
    let cancelled = false;
    const load = () => fetchHotspots().then(h => { if (!cancelled) setHotspots(h); }).catch(() => {});
    load();
    const t = setInterval(load, 8000);
    return () => { cancelled = true; clearInterval(t); };
  }, []);

  const setZoneSeverity = useCallback((districtId, severity) => {
    setZones(zs => zs.map(z => z.id === districtId ? { ...z, severity } : z));
  }, []);

  const addMyReportId = useCallback((id) => {
    setMyReportIds(ids => {
      const next = [id, ...ids].slice(0, 20);
      saveLocal("sahayam_my_reports", next);
      return next;
    });
  }, []);

  const value = {
    requests, zones, zoneSeverity, volunteers, hotspots, view, network, selectedDistrictId, tick, myReportIds, backendOk,
    authToken, currentUser, authError, authBusy, login, logout, continueOffline,
    setView, setNetwork, setSelectedDistrictId,
    addRequest, updateStatus, assignRequest, claimRequest, setZoneSeverity, addMyReportId,
  };
  return <AppContext.Provider value={value}>{children}</AppContext.Provider>;
}

/* ============================================================
   KERALA MAP
   ============================================================ */
function KeralaMap({ interactive = true, markerScope = "admin", pinMode = false, pinLatLng = null, onPick, mapId, showHotspots = true }) {
  const { zoneSeverity, requests, hotspots, selectedDistrictId, setSelectedDistrictId } = useApp();
  const svgRef = useRef(null);
  const districtPathRefs = useRef({});
  const [zoomBox, setZoomBox] = useState({ scale: 1, tx: 0, ty: 0 });
  const maxHotspotSize = hotspots.length ? Math.max(...hotspots.map(h => h.size)) : 1;

  const scopedRequests = markerScope === "volunteer" || markerScope === "citizen"
    ? requests.filter(r => r.status !== "Resolved")
    : requests;

  const handleBgClick = (e) => {
    if (!pinMode || !onPick) return;
    const svg = svgRef.current;
    const pt = svg.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    const loc = pt.matrixTransform(svg.getScreenCTM().inverse());
    const [lat, lng] = unproject(loc.x, loc.y);
    onPick(lat, lng);
  };

  const pinXY = pinLatLng ? project(pinLatLng[0], pinLatLng[1]) : null;

  // Click-to-zoom: when an admin/volunteer map has a selected district, compute a
  // tight bounding box around its shape (via native getBBox) and zoom the map's
  // content group into it. Non-interactive / pin-picker maps never zoom.
  useEffect(() => {
    if (!interactive) return;
    if (!selectedDistrictId) {
      setZoomBox({ scale: 1, tx: 0, ty: 0 });
      return;
    }
    const el = districtPathRefs.current[selectedDistrictId];
    if (!el) return;
    let bbox;
    try { bbox = el.getBBox(); } catch (err) { return; }
    if (!bbox || bbox.width === 0 || bbox.height === 0) return;
    const padX = bbox.width * 0.18;
    const padY = bbox.height * 0.18;
    const bx = bbox.x - padX, by = bbox.y - padY;
    const bw = bbox.width + padX * 2, bh = bbox.height + padY * 2;
    const scale = Math.max(1, Math.min(KERALA_VB.w / bw, KERALA_VB.h / bh, 7));
    const cx = bx + bw / 2, cy = by + bh / 2;
    const tx = KERALA_VB.w / 2 - cx * scale;
    const ty = KERALA_VB.h / 2 - cy * scale;
    setZoomBox({ scale, tx, ty });
  }, [selectedDistrictId, interactive]);

  const zoomed = interactive && zoomBox.scale > 1.01;
  const invScale = 1 / zoomBox.scale;

  return (
    <div className="card">
      <div className="card-head">
        <IconMap size={15} />
        <h3>{pinMode ? "Tap your location" : "Affected Districts"}</h3>
        <span className="sub">{pinMode ? "precise pin for your request" : "click a district to filter"}</span>
        <div className="card-head-spacer" />
        {interactive && selectedDistrictId && (
          <button className="map-filter-chip" onClick={() => setSelectedDistrictId(null)}>
            {zoomed && <>Zoomed &mdash; </>}{districtById[selectedDistrictId].name} &#x2715;
          </button>
        )}
      </div>
      <div className="map-wrap">
        <svg ref={svgRef} className={"map-svg" + (pinMode ? " pickable" : "")}
             viewBox={`0 0 ${KERALA_VB.w} ${KERALA_VB.h}`} xmlns="http://www.w3.org/2000/svg"
             onClick={handleBgClick}>
          <defs>
            <pattern id={"water-" + mapId} width="10" height="5" patternUnits="userSpaceOnUse">
              <path d="M0 3 Q2.5 0 5 3 T10 3" stroke="var(--border-soft)" strokeWidth="0.7" fill="none" />
            </pattern>
          </defs>
          <rect x="0" y="0" width={KERALA_VB.w} height={KERALA_VB.h} fill={"url(#water-" + mapId + ")"} opacity="0.35" />

          <g className="map-zoom-group"
             style={{ transform: `matrix(${zoomBox.scale},0,0,${zoomBox.scale},${zoomBox.tx},${zoomBox.ty})` }}>

          {KERALA_DISTRICTS.map(d => {
            const severity = zoneSeverity[d.id] || d.severity;
            const dimmed = interactive && selectedDistrictId && selectedDistrictId !== d.id;
            return (
              <g key={d.id}>
                <path
                  ref={el => { districtPathRefs.current[d.id] = el; }}
                  d={d.d}
                  className={"district-shape" + (dimmed ? " dimmed" : "") + (interactive ? "" : " static")}
                  fill={SEVERITY_COLOR[severity]}
                  fillOpacity={0.5}
                  style={zoomed ? { strokeWidth: 1.1 * invScale } : undefined}
                  onClick={interactive ? () => setSelectedDistrictId(selectedDistrictId === d.id ? null : d.id) : undefined}
                />
                {(!zoomed || selectedDistrictId === d.id) && (
                  <text x={d.cx} y={d.cy - 1.5} textAnchor="middle" className="district-label"
                        style={zoomed ? { transform: `scale(${invScale})`, transformOrigin: `${d.cx}px ${d.cy - 1.5}px` } : undefined}>
                    {d.name}
                  </text>
                )}
              </g>
            );
          })}

          {showHotspots && hotspots.map(h => {
            const [x, y] = project(h.center_lat, h.center_lng);
            const r = 10 + 9 * (h.size / maxHotspotSize);
            return (
              <g key={"hotspot-" + h.cluster_id} className="hotspot-cluster">
                <circle className="hotspot-ring" cx={x} cy={y} r={r} style={zoomed ? { strokeWidth: 1 * invScale } : undefined} />
                <circle cx={x} cy={y} r={r} fill="var(--critical)" fillOpacity={0.16} stroke="var(--critical)" strokeOpacity={0.55}
                        strokeWidth={zoomed ? invScale : 1} strokeDasharray={zoomed ? `${2.5 * invScale} ${2 * invScale}` : "2.5 2"} />
                <text x={x} y={y + r + 8} textAnchor="middle" className="hotspot-label"
                      style={zoomed ? { transform: `scale(${invScale})`, transformOrigin: `${x}px ${y + r + 8}px` } : undefined}>
                  {h.size} reports clustered
                </text>
              </g>
            );
          })}

          {scopedRequests.map(r => {
            const [x, y] = project(r.lat, r.lng);
            const dimmed = interactive && selectedDistrictId && selectedDistrictId !== r.districtId;
            const small = markerScope === "citizen";
            return (
              <g key={r.id} className={"req-marker" + (interactive ? "" : " static")}
                 transform={`translate(${x},${y})`}
                 opacity={dimmed ? 0.18 : (small ? 0.85 : 1)}
                 onClick={interactive ? () => setSelectedDistrictId(r.districtId) : undefined}>
                {r.priority === "Emergency" && <circle className="pulse" r={small ? 3.2 : 4.2} fill={PRI_COLOR[r.priority]} />}
                <circle r={small ? 3.2 : 4.2} fill={PRI_COLOR[r.priority]} stroke="var(--bg)" strokeWidth={zoomed ? 1.1 * invScale : 1.1} />
              </g>
            );
          })}

          {pinMode && pinXY && (
            <g className="pin-marker" transform={`translate(${pinXY[0]},${pinXY[1]})`}>
              <circle className="pulse" r="6" fill="var(--accent)" />
              <circle r="6" fill="var(--accent)" stroke="var(--bg)" strokeWidth="1.6" />
              <circle r="2.2" fill="var(--bg)" />
            </g>
          )}
          </g>
        </svg>
      </div>
      <div className="legend">
        {SEVERITY_LIST.map(s => (
          <span key={s} className="legend-item">
            <span className="legend-swatch" style={{ background: SEVERITY_COLOR[s], opacity: 0.7 }} /> {s}
          </span>
        ))}
        {!pinMode && PRIORITIES.map(p => (
          <span key={p} className="legend-item">
            <span className="legend-swatch" style={{ background: PRI_COLOR[p], borderRadius: "50%" }} /> {p}
          </span>
        ))}
        {showHotspots && hotspots.length > 0 && (
          <span className="legend-item">
            <span className="legend-swatch" style={{ background: "transparent", border: "1.5px dashed var(--critical)", borderRadius: "50%" }} />
            ML-detected hotspot ({hotspots.length})
          </span>
        )}
      </div>
    </div>
  );
}

/* ============================================================
   ADMIN &mdash; priority queue
   ============================================================ */
function PriorityQueue() {
  const { requests, volunteers, selectedDistrictId, tick, assignRequest, updateStatus } = useApp();
  const filtered = useMemo(() => {
    let rs = requests;
    if (selectedDistrictId) rs = rs.filter(r => r.districtId === selectedDistrictId);
    return [...rs].sort((a, b) => {
      if (a.status === "Resolved" && b.status !== "Resolved") return 1;
      if (b.status === "Resolved" && a.status !== "Resolved") return -1;
      const pr = PRI_RANK[a.priority] - PRI_RANK[b.priority];
      if (pr !== 0) return pr;
      return a.createdAt - b.createdAt;
    });
  }, [requests, selectedDistrictId]);

  return (
    <div className="card">
      <div className="card-head">
        <IconLayers size={15} />
        <h3>Live Request Queue</h3>
        <span className="sub">{filtered.length} &middot; priority order</span>
      </div>
      <div className="card-body">
        {filtered.length === 0 ? (
          <div className="empty-state">
            <IconCheckCircle size={28} />
            <p>No requests in this district.</p>
          </div>
        ) : (
          <div className="queue-list">
            {filtered.map(r => {
              const d = districtById[r.districtId];
              const vol = volunteers.find(v => v.name === r.assignedTo);
              return (
                <div key={r.id} className="req-row">
                  <div className="pri-stripe" style={{ background: PRI_COLOR[r.priority] }} />
                  <div className="req-row-body">
                    <div className="req-row-top">
                      <span className="pri-pill" style={{ background: PRI_BG[r.priority], color: PRI_COLOR[r.priority] }}>{r.priority}</span>
                      <span className="req-row-title">{r.name || "Unnamed reporter"}</span>
                      <span className="status-pill">{r.status}</span>
                    </div>
                    <div className="req-row-desc">{r.desc}</div>
                    <div className="req-row-meta">
                      <span><IconMapPin size={11} style={{ verticalAlign: "-2px" }} /> {d.name}</span>
                      <span className="mono">{r.lat.toFixed(3)}, {r.lng.toFixed(3)}</span>
                      <span className="mono">{r.id}</span>
                      <span className="channel-tag mono">{r.channel === "sms" ? <IconRadio size={11} /> : <IconWifi size={11} />} {r.channel}</span>
                      <span className="mono">{relTime(r.createdAt, tick)}</span>
                      {vol && <span>&rarr; {vol.name}</span>}
                    </div>
                    {r.status === "Pending" && (
                      <div style={{ marginTop: 8, display: "flex", gap: 6, flexWrap: "wrap" }}>
                        {volunteers.map(v => (
                          <button key={v.id} className="btn btn-ghost btn-sm" onClick={() => assignRequest(r.id, v.id)}>
                            Assign {v.name.split(" ")[0]}
                          </button>
                        ))}
                      </div>
                    )}
                    {r.status !== "Resolved" && r.status !== "Pending" && (
                      <div style={{ marginTop: 8 }}>
                        <button className="btn btn-ghost btn-sm" onClick={() => updateStatus(r.id, "Resolved")}>
                          <IconCheck size={12} /> Mark resolved
                        </button>
                      </div>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

            <label>Vulnerability flags (fed into the ML triage engine)</label>
            <div className="pri-select">
              <div className={"pri-opt" + (elderly ? " active" : "")} onClick={() => setElderly(v => !v)}>Elderly</div>
              <div className={"pri-opt" + (children ? " active" : "")} onClick={() => setChildren(v => !v)}>Children</div>
              <div className={"pri-opt" + (medical ? " active" : "")} onClick={() => setMedical(v => !v)}>Medical need</div>
            </div>
          </div>
          <button type="submit" className="btn btn-primary btn-block" disabled={submitting}>
            <IconSend size={14} /> {submitting ? "Submitting..." : "Inject request"}
          </button>
        </form>
        {lastAdded && (
          <div style={{ marginTop: 12, fontSize: 11.5, color: "var(--text-faint)" }} className="mono">
            Logged {lastAdded.id} &middot; ML triage: <span style={{ color: PRI_COLOR[lastAdded.priority] }}>{lastAdded.priority}</span>
            {lastAdded.mlScore != null ? ` (score ${lastAdded.mlScore})` : ""} at {new Date(lastAdded.createdAt).toLocaleTimeString('en-IN', { hour12: false })}
          </div>
        )}
      </div>
    </div>
  );
}

function StatusSteps({ req }) {
  const { updateStatus } = useApp();
  const currentIdx = STATUS_FLOW.indexOf(req.status);
  return (
    <div className="status-steps">
      {STATUS_FLOW.map((s, i) => {
        const done = i < currentIdx || (req.status === "Resolved" && i <= currentIdx);
        const isCurrent = i === currentIdx;
        const clickable = i === currentIdx + 1;
        return (
          <button
            key={s}
            className={"status-step" + (i <= currentIdx ? " done" : "") + (isCurrent ? " current" : "")}
            disabled={!clickable}
            onClick={() => clickable && updateStatus(req.id, s)}
          >
            {i <= currentIdx ? <IconCheck size={11} style={{ verticalAlign: "-2px" }} /> : null} {s}
          </button>
        );
      })}
    </div>
  );
}

function VolunteerDashboard() {
  const { requests, currentUser, network, selectedDistrictId, setSelectedDistrictId, tick, claimRequest } = useApp();
  const [claimingId, setClaimingId] = useState(null);
  const [claimError, setClaimError] = useState(null);

  const vol = currentUser && currentUser.role === "volunteer" ? currentUser : null;
  const volXY = vol ? project(vol.lat, vol.lng) : [0, 0];

  const myTasks = useMemo(() => {
    if (!vol) return [];
    let mine = requests.filter(r => r.assignedTo === vol.name);
    if (selectedDistrictId) mine = mine.filter(r => r.districtId === selectedDistrictId);
    return mine.sort((a, b) => {
      if ((a.status === "Resolved") !== (b.status === "Resolved")) return a.status === "Resolved" ? 1 : -1;
      const dA = dist(volXY, project(a.lat, a.lng));
      const dB = dist(volXY, project(b.lat, b.lng));
      return dA - dB;
    });
  }, [requests, vol, selectedDistrictId, volXY]);

  const nearby = useMemo(() => {
    if (!vol) return [];
    let open = requests.filter(r => !r.assignedTo && r.status === "Pending");
    if (selectedDistrictId) open = open.filter(r => r.districtId === selectedDistrictId);
    return open.sort((a, b) => {
      const dA = dist(volXY, project(a.lat, a.lng));
      const dB = dist(volXY, project(b.lat, b.lng));
      return dA - dB;
    });
  }, [requests, vol, selectedDistrictId, volXY]);

  if (!vol) return <LoginForm role="volunteer" />;

  const activeCount = myTasks.filter(r => r.status !== "Resolved").length;
  const resolvedCount = myTasks.filter(r => r.status === "Resolved").length;

  const handleClaim = async (id) => {
    setClaimingId(id); setClaimError(null);
    const res = await claimRequest(id);
    setClaimingId(null);
    if (!res.ok) setClaimError(res.error || "Could not claim this request &mdash; someone may have just taken it.");
  };

  return (
    <div className="vshell">
      <div className="card v-profile">
        <div className="v-avatar">{vol.name.split(" ").map(n => n[0]).join("")}</div>
        <div>
          <div className="v-name">{vol.name}</div>
          <div className="v-sub">Base: {nearestDistrict(vol.lat, vol.lng).name}</div>
        </div>
      </div>

      <div className="v-stats">
        <div className="v-stat"><div className="n">{activeCount}</div><div className="l">ACTIVE</div></div>
        <div className="v-stat"><div className="n">{resolvedCount}</div><div className="l">RESOLVED</div></div>
        <div className="v-stat"><div className="n mono">{fmtClock(tick).slice(0, 5)}</div><div className="l">LOCAL TIME</div></div>
      </div>

      <KeralaMap interactive={true} markerScope="volunteer" mapId="vol" />

      {selectedDistrictId && (
        <div className="filter-banner" style={{ marginTop: 14 }}>
          <IconMapPin size={14} />
          Showing requests in {districtById[selectedDistrictId].name}
          <button className="btn btn-ghost btn-sm" style={{ marginLeft: "auto" }} onClick={() => setSelectedDistrictId(null)}>Clear</button>
        </div>
      )}

      <div className="section-title">
        <h3>Nearby Requests</h3>
        {nearby.length > 0 && <span className="badge-count">{nearby.length}</span>}
      </div>
      <p style={{ fontSize: 11.5, color: "var(--text-faint)", margin: "-8px 0 12px" }}>Unclaimed requests, closest to your base first &mdash; pick which one you'll attend to.</p>
      {claimError && <div className="login-error">{claimError}</div>}
      {nearby.length === 0 ? (
        <div className="empty-state card">
          <IconCheckCircle size={28} />
          <p>No unclaimed requests right now{selectedDistrictId ? " in this district" : ""}.</p>
        </div>
      ) : (
        nearby.map(r => (
          <ClaimCard key={r.id} req={r} volXY={volXY} claiming={claimingId === r.id} onClaim={() => handleClaim(r.id)} />
        ))
      )}

      <div className="section-title" style={{ marginTop: 22 }}>
        <h3>My Tasks</h3>
        {activeCount > 0 && <span className="badge-count">{activeCount}</span>}
      </div>

      {myTasks.length === 0 ? (
        <div className="empty-state card">
          <IconInbox size={28} />
          <p>Claim a request above to get started.</p>
        </div>
      ) : network === "sms" ? (
        myTasks.map(r => <SmsPayloadCard key={r.id} req={r} />)
      ) : (
        myTasks.map(r => <TaskCard key={r.id} req={r} volXY={volXY} />)
      )}
    </div>
  );
}

function ConfirmPanel({ req, onDismiss }) {
  const { requests } = useApp();
  const position = useMemo(() => {
    const open = requests.filter(r => r.status !== "Resolved").sort((a, b) => {
      const pr = PRI_RANK[a.priority] - PRI_RANK[b.priority];
      if (pr !== 0) return pr;
      return a.createdAt - b.createdAt;
    });
    return open.findIndex(r => r.id === req.id) + 1;
  }, [requests, req.id]);
  const d = districtById[req.districtId];

  return (
    <div className="card confirm-panel">
      <span className="pri-pill" style={{ background: PRI_BG[req.priority], color: PRI_COLOR[req.priority] }}>{req.priority}</span>
      <h2>Help request logged</h2>
      <p>Volunteers in {d.name} have been alerted. Keep your phone reachable.</p>
      <div className="confirm-stat-row">
        <div className="confirm-stat">
          <div className="n mono">{req.id}</div>
          <div className="l">REQUEST ID</div>
        </div>
        <div className="confirm-stat">
          <div className="n">{position > 0 ? position : "-"}</div>
          <div className="l">QUEUE POSITION</div>
        </div>
        <div className="confirm-stat">
          <div className="n">{d.name}</div>
          <div className="l">DISTRICT</div>
        </div>
      </div>
      <button className="btn btn-ghost btn-block" onClick={onDismiss}>Report another request</button>
    </div>
  );
}

function CitizenApp() {
  const { addRequest, requests, myReportIds, addMyReportId, tick } = useApp();
  const [name, setName] = useState("");
  const [phone, setPhone] = useState("");
  const [desc, setDesc] = useState("");
  const [category, setCategory] = useState("rescue");
  const [elderly, setElderly] = useState(false);
  const [children, setChildren] = useState(false);
  const [medical, setMedical] = useState(false);
  const [pin, setPin] = useState(null);
  const [pinIsGps, setPinIsGps] = useState(false);
  const [geoStatus, setGeoStatus] = useState("idle"); // idle | locating | granted | denied | unsupported
  const [confirmed, setConfirmed] = useState(null);
  const [submitting, setSubmitting] = useState(false);

  const pinDistrict = pin ? nearestDistrict(pin.lat, pin.lng) : null;
  const preview = useMemo(() => classifyUrgency(desc, { elderly, children, medical }), [desc, elderly, children, medical]);

  const useMyLocation = useCallback(() => {
    if (!("geolocation" in navigator)) { setGeoStatus("unsupported"); return; }
    setGeoStatus("locating");
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        setPin({ lat: pos.coords.latitude, lng: pos.coords.longitude });
        setPinIsGps(true);
        setGeoStatus("granted");
      },
      () => { setGeoStatus("denied"); },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
    );
  }, []);

  // Try to get the reporter's real location automatically as soon as the
  // form opens; tapping the map below always still works as a fallback or
  // to correct/refine the pin.
  useEffect(() => { useMyLocation(); }, [useMyLocation]);

  const submit = async (e) => {
    e.preventDefault();
    if (!desc.trim() || !pin || submitting) return;
    setSubmitting(true);
    const req = await addRequest({
      name: name.trim() || null, phone: phone.trim() || null, desc: desc.trim(),
      category, has_elderly: elderly, has_children: children, has_medical: medical,
      lat: pin.lat, lng: pin.lng,
    });
    setSubmitting(false);
    addMyReportId(req.id);
    setConfirmed(req);
    setName(""); setPhone(""); setDesc(""); setCategory("rescue");
    setElderly(false); setChildren(false); setMedical(false); setPin(null); setPinIsGps(false); setGeoStatus("idle");
  };

  const myReports = useMemo(
    () => myReportIds.map(id => requests.find(r => r.id === id)).filter(Boolean),
    [myReportIds, requests]
  );

  if (confirmed) {
    return (
      <div className="cshell">
        <ConfirmPanel req={confirmed} onDismiss={() => setConfirmed(null)} />
        {myReports.length > 0 && (
          <>
            <div className="section-title" style={{ marginTop: 22 }}><h3>Your reports</h3></div>
            {myReports.map(r => (
              <div key={r.id} className="my-report-row">
                <span className="pri-pill" style={{ background: PRI_BG[r.priority], color: PRI_COLOR[r.priority] }}>{r.priority}</span>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div className="desc">{r.desc}</div>
                  <div className="meta mono">{r.id} &middot; {relTime(r.createdAt, tick)}</div>
                </div>
                <span className="status-pill">{r.status}</span>
              </div>
            ))}
          </>
        )}
      </div>
    );
  }

  return (
    <div className="cshell">
      <div className="c-hero">
        <h1>Need help right now?</h1>
        <p>Tell us what is happening and tap your location on the map. Every report reaches a volunteer &mdash; the most urgent ones first.</p>
      </div>

      <form onSubmit={submit} className="stack">
        <div style={{ marginBottom: 14 }}>
          <div className={"pin-hint" + (pin ? " set" : "")}>
            <IconMapPin size={15} />
            <span style={{ flex: 1 }}>
              {geoStatus === "locating" && !pin && "Finding your location..."}
              {pin && pinIsGps && `Using your device location near ${pinDistrict.name} (${pin.lat.toFixed(4)}, ${pin.lng.toFixed(4)})`}
              {pin && !pinIsGps && `Pinned near ${pinDistrict.name} (${pin.lat.toFixed(4)}, ${pin.lng.toFixed(4)})`}
              {!pin && geoStatus !== "locating" && "Share your location, or tap the map below to mark exactly where help is needed"}
            </span>
            <button type="button" className="btn btn-ghost btn-sm" onClick={useMyLocation} disabled={geoStatus === "locating"}>
              <IconNavigation size={12} /> {geoStatus === "locating" ? "Locating..." : "Use my location"}
            </button>
          </div>
          {(geoStatus === "denied" || geoStatus === "unsupported") && !pin && (
            <div className="geo-note">
              {geoStatus === "denied" ? "Location access was denied or timed out." : "Your device doesn't support location sharing."} Tap the map below to mark your location instead.
            </div>
          )}
          <KeralaMap interactive={false} markerScope="citizen" pinMode={true} pinLatLng={pin ? [pin.lat, pin.lng] : null}
                     onPick={(lat, lng) => { setPin({ lat, lng }); setPinIsGps(false); }} mapId="citizen" />
        </div>

        <div className="field">
          <label>What kind of help do you need?</label>
          <div className="cat-grid">
            {CATEGORIES.map(c => (
              <div key={c.id} className={"cat-chip" + (category === c.id ? " active" : "")} onClick={() => setCategory(c.id)}>
                <c.Icon size={17} />
                {c.label}
              </div>
            ))}
          </div>
        </div>

        <div className="field">
          <label htmlFor="c-desc">Describe the situation *</label>
          <textarea id="c-desc" rows="4" required value={desc} onChange={e => setDesc(e.target.value)}
                    placeholder="Who needs help, and what's happening? e.g. water rising fast, elderly parent alone upstairs." />
        </div>

        <div className="field">
          <label>Does this involve anyone vulnerable?</label>
          <div className="vuln-grid">
            <div className={"vuln-chip" + (elderly ? " active" : "")} onClick={() => setElderly(v => !v)}>
              {elderly ? <IconCheck size={13} /> : null} Elderly person
            </div>
            <div className={"vuln-chip" + (children ? " active" : "")} onClick={() => setChildren(v => !v)}>
              {children ? <IconCheck size={13} /> : null} Children
            </div>
            <div className={"vuln-chip" + (medical ? " active" : "")} onClick={() => setMedical(v => !v)}>
              {medical ? <IconCheck size={13} /> : null} Medical condition
            </div>
          </div>
        </div>

        <div className="field-row">
          <div className="field">
            <label htmlFor="c-name">Your name <span style={{ fontWeight: 500, color: "var(--text-faint)" }}>(optional)</span></label>
            <input id="c-name" value={name} onChange={e => setName(e.target.value)} placeholder="Full name" />
          </div>
          <div className="field">
            <label htmlFor="c-phone">Phone <span style={{ fontWeight: 500, color: "var(--text-faint)" }}>(optional)</span></label>
            <input id="c-phone" value={phone} onChange={e => setPhone(e.target.value)} placeholder="98470 00000" />
          </div>
        </div>

        {desc.trim() && (
          <div className="mono" style={{ fontSize: 11, color: "var(--text-faint)", marginBottom: 10 }}>
            Estimated priority: <span style={{ color: PRI_COLOR[preview.priority] }}>{preview.priority}</span> &middot; the backend's ML triage engine makes the final call
          </div>
        )}
        <button type="submit" className="btn btn-primary btn-block" disabled={!desc.trim() || !pin || submitting}>
          <IconSend size={14} /> {submitting ? "Sending..." : "Send help request"}
        </button>
      </form>

      {myReports.length > 0 && (
        <>
          <div className="section-title" style={{ marginTop: 24 }}><h3>Your reports</h3></div>
          {myReports.map(r => (
            <div key={r.id} className="my-report-row">
              <span className="pri-pill" style={{ background: PRI_BG[r.priority], color: PRI_COLOR[r.priority] }}>{r.priority}</span>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div className="desc">{r.desc}</div>
                <div className="meta mono">{r.id} &middot; {relTime(r.createdAt, tick)}</div>
              </div>
              <span className="status-pill">{r.status}</span>
            </div>
          ))}
        </>
      )}
    </div>
  );
}
